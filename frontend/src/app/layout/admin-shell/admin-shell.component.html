<div class="dash-shell">
  <header class="dash-header">
    <a class="dash-brand" routerLink="/dashboard">
      <div class="dash-brand-icon" aria-hidden="true">
        <img src="/logo.png" alt="Aquapulse" style="width:36px;height:36px;object-fit:contain;" />
      </div>
      <div>
        <span class="dash-brand-text">Aquapulse</span>
        <span class="dash-brand-sub">Administration du club</span>
      </div>
    </a>
    <nav class="dash-nav" aria-label="Navigation principale">
      <ul class="dash-nav-links">
        <li><a routerLink="/dashboard" routerLinkActive="active">Tableau de bord</a></li>
        <li><a routerLink="/competitions" routerLinkActive="active">Compétitions</a></li>
        <li><a routerLink="/resultats" routerLinkActive="active">Résultats</a></li>
        <li><a routerLink="/live" routerLinkActive="active">Direct 🔴</a></li>
        <li><a routerLink="/statistiques" routerLinkActive="active">Statistiques</a></li>
        <li><a routerLink="/international" routerLinkActive="active">International</a></li>
        <li><a routerLink="/athletes" routerLinkActive="active">Athlètes</a></li>
        <li><a routerLink="/entraineurs" routerLinkActive="active">Entraîneurs</a></li>
        <li><a routerLink="/reservations" routerLinkActive="active">Réservations</a></li>
      </ul>
    </nav>
    <div class="dash-header-actions">
      <button
        type="button"
        class="dash-icon-btn theme-toggle-btn"
        title="Thème clair / sombre"
        aria-label="Basculer le thème"
        (click)="toggleTheme()"
      >
        <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5v2H10V2h2zm0 20v-2h2v2h-2zM4.22 5.64l1.42-1.42 1.41 1.41-1.41 1.42-1.42-1.41zm15.56 12.72 1.42 1.42-1.41 1.41-1.42-1.41 1.41-1.42zM2 12h2v-2H2v2zm18 0h2v-2h-2v2zM5.64 19.78l1.41-1.42 1.42 1.41-1.41 1.42-1.42-1.41zm12.72-15.56 1.42-1.41 1.41 1.41-1.41 1.42-1.42-1.41z" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.5 5.5 0 0 1-6.9-6.9A9 9 0 0 0 12 3z" />
        </svg>
      </button>
      <button type="button" class="dash-icon-btn" title="Menu">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z" /></svg>
      </button>
      <button type="button" class="dash-avatar" title="Déconnexion" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
        </svg>
      </button>
    </div>
  </header>

  <router-outlet />
</div>
