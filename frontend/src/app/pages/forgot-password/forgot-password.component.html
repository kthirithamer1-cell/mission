<div class="auth-gate">
  <div class="auth-gate-shell">
    <app-auth-brand subtitle="Mot de passe oublié" />

    <section class="dash-card auth-gate-card">
      <p class="dash-card-label">Récupération</p>
      <h1 class="dash-card-title auth-gate-title">Mot de passe oublié</h1>

      @if (alertMessage()) {
        <div
          class="auth-alert"
          [class.auth-alert--error]="alertType() === 'error'"
          [class.auth-alert--success]="alertType() === 'success'"
          role="alert"
        >
          {{ alertMessage() }}
        </div>
      }

      <form class="ui-form" (ngSubmit)="onSubmit()" novalidate>
        <label class="ui-field">
          <span>Adresse email</span>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            required
            placeholder="vous@aquapulse.tn"
          />
        </label>
        
        <button
          type="submit"
          class="dash-btn dash-btn-primary auth-gate-submit"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="auth-spinner"></span>Envoi en cours…
          } @else {
            Envoyer le lien de réinitialisation
          }
        </button>
      </form>

      <p class="auth-gate-footer">
        <a routerLink="/login">Retour à la connexion</a>
      </p>
    </section>
  </div>
</div>
