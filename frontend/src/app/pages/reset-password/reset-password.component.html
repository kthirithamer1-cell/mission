<div class="auth-gate">
  <div class="auth-gate-shell">
    <app-auth-brand subtitle="Réinitialisation" />

    <section class="dash-card auth-gate-card">
      <p class="dash-card-label">Mot de passe</p>
      <h1 class="dash-card-title auth-gate-title">Nouveau mot de passe</h1>

      @if (alertMessage()) {
        <div
          class="auth-alert"
          [class.auth-alert--error]="alertType() === 'error'"
          [class.auth-alert--success]="alertType() === 'success'"
          role="alert"
        >
          {{ alertMessage() }}
        </div>
      }

      <form class="ui-form" (ngSubmit)="onSubmit()" novalidate>
        <label class="ui-field">
          <span>Nouveau mot de passe</span>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            required
            placeholder="••••••••"
            [disabled]="!token"
          />
        </label>
        
        <label class="ui-field">
          <span>Confirmer le mot de passe</span>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            autocomplete="new-password"
            required
            placeholder="••••••••"
            [disabled]="!token"
          />
        </label>
        
        <button
          type="submit"
          class="dash-btn dash-btn-primary auth-gate-submit"
          [disabled]="loading() || !token"
        >
          @if (loading()) {
            <span class="auth-spinner"></span>Envoi en cours…
          } @else {
            Définir le nouveau mot de passe
          }
        </button>
      </form>

      <p class="auth-gate-footer">
        <a routerLink="/login">Retour à la connexion</a>
      </p>
    </section>
  </div>
</div>
