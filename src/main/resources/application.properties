# Requires MySQL listening on localhost:3306 with database projectmission (or createDatabaseIfNotExist).
# If you see "Connection refused", start MySQL or run with profile dev (in-memory H2), for example:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# PowerShell: mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
spring.datasource.url=jdbc:mysql://localhost:3306/projectmission?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=OFF
