spring.datasource.url=jdbc:mysql://localhost:3306/projectmission?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=OFF

# Email — Brevo SMTP
# IMPORTANT: app.mail.from must be a VERIFIED sender in Brevo (not the smtp-brevo.com login)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:thamer.kthiri@esprit.tn}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.verification.token-expiry-hours=24
