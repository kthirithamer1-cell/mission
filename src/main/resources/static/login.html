<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Project Mission</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="logo" aria-hidden="true">🏊</div>
      <h1>Project Mission</h1>
      <p>Swimming club management</p>
    </div>

    <div class="auth-card">
      <h2>Sign in</h2>
      <div id="login-alert" class="alert" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-primary" id="login-submit">Sign in</button>
      </form>

      <p class="auth-footer">
        No account yet? <a href="/register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
