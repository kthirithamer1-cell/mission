<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Project Mission</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrapper dashboard-card">
    <div class="auth-brand">
      <div class="logo" aria-hidden="true">🏊</div>
      <h1>Project Mission</h1>
      <p>Welcome back</p>
    </div>

    <div class="auth-card">
      <h2>Dashboard</h2>
      <div id="user-info" class="user-info">Loading…</div>
      <button type="button" class="btn-primary btn-logout" id="logout-btn">Sign out</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = getUser();
    const token = getToken();

    if (!token || !user) {
      window.location.href = "/login.html";
    } else {
      document.getElementById("user-info").innerHTML =
        `<strong>${user.prenom} ${user.nom}</strong><br>` +
        `Email: ${user.email}<br>` +
        `Role: ${user.role}`;
    }

    document.getElementById("logout-btn").addEventListener("click", () => {
      clearSession();
      window.location.href = "/login.html";
    });
  </script>
</body>
</html>
